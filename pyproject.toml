[project]
name = "f1docktimers"
version = "1.0.0"
description = "F1 schedule, countdowns, live timing and standings for the Windows 11 tray, desktop and taskbar. Inspired by the Noctalia F1 plugin."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PySide6-Essentials>=6.8",
    "keyring>=25",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.10", "pillow>=10"]

[project.gui-scripts]
f1docktimers = "f1win.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
