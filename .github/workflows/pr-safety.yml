name: PR safety check

# Points the reviewer at the lines of a pull request that need the closest look: running other
# programs, new web addresses, registry or startup changes, reading the keyboard/clipboard/screen,
# deleting files, credentials near logs, hidden payloads, binaries and build/release changes.
#
# Security: pull_request_target runs this workflow and tools/pr_safety.py from the main branch, so a
# pull request cannot switch the check off by editing it. The pull request's code is only downloaded
# as a text diff; it is never checked out, built or run here.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5          # the main branch, never the pull request
      - name: Download the pull request's changes as text
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/pr.diff"
      - name: Scan for red flags
        run: python3 tools/pr_safety.py "$RUNNER_TEMP/pr.diff"
      - name: Check commit messages for AI co-author credits
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" --paginate \
            --jq '.[] | .sha[0:7] + " " + (.commit.message | split("\n") | map(select(test("co-authored-by:.*(claude|anthropic|copilot|openai|chatgpt|cursor|codex|gemini)"; "i"))) | join(" | "))' \
            | grep -v '^[0-9a-f]* $' > "$RUNNER_TEMP/ai-credits.txt" || true
          if [ -s "$RUNNER_TEMP/ai-credits.txt" ]; then
            {
              echo "## AI co-author credits found"
              echo
              echo "Please remove the \`Co-authored-by\` lines that credit an AI tool, then force-push:"
              echo
              sed 's/^/- /' "$RUNNER_TEMP/ai-credits.txt"
            } >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/ai-credits.txt"
            exit 1
          fi
