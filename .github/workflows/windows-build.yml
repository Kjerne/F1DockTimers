name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write   # needed to attach the builds to a release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Test and build
        shell: pwsh
        run: |
          python -m venv .venv
          ./build/build.ps1
      - name: Smoke test the executables
        shell: pwsh
        run: |
          $p = Start-Process dist/F1DockTimers/F1DockTimers.exe -ArgumentList "--minimized" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "F1DockTimers.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id
          $q = Get-ChildItem dist -Filter "*-portable.exe" | Select-Object -First 1
          $p2 = Start-Process $q.FullName -ArgumentList "--minimized" -PassThru
          Start-Sleep -Seconds 20
          if ($p2.HasExited) { throw "portable exe exited early with code $($p2.ExitCode)" }
          Get-Process F1DockTimers*, F1DockTimers-* -ErrorAction SilentlyContinue | Stop-Process
      - name: Upload unsigned build
        id: unsigned
        uses: actions/upload-artifact@v5
        with:
          name: F1DockTimers-windows
          path: |
            dist/*-portable.exe
            dist/*-setup.exe

      # Code signing via SignPath Foundation. Dormant until the repository variable
      # SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN are set
      # (Settings > Secrets and variables > Actions). Runs for releases only; every
      # request must be approved manually in SignPath before it completes.
      - name: Sign with SignPath
        id: sign
        if: vars.SIGNPATH_ORGANIZATION_ID != '' && (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/'))
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'F1DockTimers' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG || 'initial' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Pick files for the release
        id: files
        shell: pwsh
        run: |
          if ("${{ steps.sign.outcome }}" -eq "success") { $dir = "signed" } else { $dir = "dist" }
          "dir=$dir" >> $env:GITHUB_OUTPUT
          Write-Host "Release files come from: $dir"

      - name: Attach to the release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: |
            ${{ steps.files.outputs.dir }}/*-portable.exe
            ${{ steps.files.outputs.dir }}/*-setup.exe
