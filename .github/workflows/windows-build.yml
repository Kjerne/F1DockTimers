name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write       # attach the builds to a release
  id-token: write       # sign the build provenance (Sigstore, keyless)
  attestations: write   # store that attestation on GitHub

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Test and build
        shell: pwsh
        run: |
          python -m venv .venv
          ./build/build.ps1
      - name: Smoke test the executables
        shell: pwsh
        run: |
          $p = Start-Process dist/F1DockTimers/F1DockTimers.exe -ArgumentList "--minimized" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "F1DockTimers.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id
          $q = Get-ChildItem dist -Filter "*-portable.exe" | Select-Object -First 1
          $p2 = Start-Process $q.FullName -ArgumentList "--minimized" -PassThru
          Start-Sleep -Seconds 20
          if ($p2.HasExited) { throw "portable exe exited early with code $($p2.ExitCode)" }
          Get-Process F1DockTimers*, F1DockTimers-* -ErrorAction SilentlyContinue | Stop-Process
      - name: Upload build
        uses: actions/upload-artifact@v5
        with:
          name: F1DockTimers-windows
          path: |
            dist/*-portable.exe
            dist/*-setup.exe

      # Release only: a SHA256SUMS.txt for checking downloads by hand, and a signed statement from
      # GitHub that these exact files were built by this workflow from this repository
      # (verify with: gh attestation verify <file> --repo Kjerne/F1DockTimers).
      - name: Checksums
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Name -match '-(portable|setup)\.exe$' } | Sort-Object Name |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt
      - name: Build provenance attestation
        id: attest
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*-portable.exe
            dist/*-setup.exe
      - name: Keep the attestation next to the files
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Copy-Item "${{ steps.attest.outputs.bundle-path }}" dist/F1DockTimers-attestation.sigstore.json

      - name: Attach to the release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: |
            dist/*-portable.exe
            dist/*-setup.exe
            dist/SHA256SUMS.txt
            dist/F1DockTimers-attestation.sigstore.json
